          - IBI
        ingredients:
          I: IRON_INGOT
          B: IRON_BLOCK
          S: SMITHING_TABLE
    shop_icon:
      material: IRON_SWORD
      name: Buy weapons
      lore:
        - Buy swords, axes and more
    sellgui_icon:
      material: IRON_AXE
      name: Sell items
      lore:
        - Sell weapons in one go
  rowena:
    name: Rowena
    shop: armor
    skin_value: ""
    skin_signature: ""
    default_dialogue: "Rowena: Without my bellows the blast furnace is useless and without the blast furnace I cannot smelt a thing. Craft me a new one and my stock is open to you"
    correct_item_dialogue: "Rowena: Just what I needed! With these bellows, the furnace will roar again."
