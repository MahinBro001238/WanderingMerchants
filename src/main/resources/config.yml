#DO NOT CHANGE THIS VALUE
config_version: 3.1

# How often the plugin checks for merchants that should despawn, in seconds
# Warning: If this value is too high, merchants may stay longer than the specified despawn time
# This should be less than all the despawn time and divide evenly into all the despawn time
# By default the plugins checks for merchants that should despawn every 2 minutes
merchant_despawn_check_frequency: 120

# Note: This is an advanced field, do not change this unless you know what you are doing
# The delay in (ticks) before the plugin revokes permission for using SellGUI
# after closing the GUI. By default it is set to 1 tick
# If your SellGUI is not working properly and it is saying
# 'No items found which can be sold.', it means that the plugin is revoking the permission
# too fast. Try increasing the delay, it should fix the issue
sellgui_permission_revoke_delay: 1

# Allow players to craft the item of a merchant in a world in which the merchant is not enabled
allow_item_crafting_without_merchant: false

# Whether to suppress the death message in chat when a merchant is killed
suppress_merchant_death_message: true

messages:

  # The message sent to a player when they don't have the permission to execute /wm command
  # Supports MiniMessage formatting (e.g. "<bold>text</bold>", "<red>text</red>")
  no_permission: "<red>You don't have permission to use this command.</red>"

  # Message sent to player when they try to craft a merchant item in a world where the merchant is not enabled
  # Supports MiniMessage formatting
  # If you don't want a message to be sent just set this field to null like
  # item_crafting_not_allowed: null
  item_crafting_not_allowed: "<red>You cannot craft this item here.</red>"

# Commands to run when certain events occur
# These commands are executed as the console after the event has completed
# Available placeholders:
#   %npc_id%            - the merchant NPC's Citizens ID
#   %merchant_id%       - the merchant's ID
#   %merchant_name%     - the merchant NPC's display name
#   %merchant_variant%  - the merchant's variant
#   %merchant_shop%     - the merchant's shop name
#   %merchant_x%        - the merchant's X coordinate
#   %merchant_y%        - the merchant's Y coordinate
#   %merchant_z%        - the merchant's Z coordinate
#   %player%            - the player associated with the event
#   %player_x%          - the player's X coordinate
#   %player_y%          - the player's Y coordinate
#   %player_z%          - the player's Z coordinate
#   %world%             - the world name
# If you don't want any commands to run for an event, set it to null like
#
# on_spawn: null
#
# Otherwise add your commands like
#
# on_spawn:
#   - "say %merchant_name% has appeared in %world%!"
#   - "broadcast A merchant is here!"
#
# EVENTS SECTION IS UNDER DEVELOPMENT AND NOT USABLE IN VERSION 1.1.7
# I added this section even though its not being used so that I don't have to migrate the config again
# To learn about when this section becomes usable, make sure to read the release notes of future releases
events:

  # When a merchant spawns into a world
  on_spawn: null

  # When a merchant despawns due to its despawn timer
  # Player related placeholders are not available for this event
  on_despawn: null

  # When a merchant is killed
  # Player related placeholders are not available if the merchant was not killed by a player
  on_kill: null

  # When a merchant takes damage
  on_damage: null

  # When a player clicks on a merchant NPC
  on_click: null

  # When a non-shopkeeper merchant becomes a shopkeeper
  on_convert_to_shopkeeper: null

  # When a merchant is healed by a player
  on_heal: null

  # When a player crafts an item using a merchant's recipe
  # Merchant related placeholders except %merchant_id% and %npc_id% are not available for this event
  on_item_craft: null

  # When a merchant begins following a player
  on_follow_start: null

  # When a merchant stops following a player
  on_follow_stop: null

# A list of all worlds merchants can spawn in
# Nether and the end are not supported, only overworld worlds are supported
# If you don't want merchants to spawn in any world, just set worlds to null
worlds:

  # The name of the world (the name of the default world is 'world')
  world:

    # How frequently should merchants spawn in this world
    # By default, a merchant can spawn once every hour
    merchant_spawn_frequency: 600

    # List of all the merchants that can spawn in this world
    # You must have atleast one merchant here
    merchants:

      # The ID of the merchant you defined in the merchants section below
      sylphie:

        # The chance of this merchant spawning
        # Must be greater than or equal to 0
        # The sum of all enabled merchants defined for this world must be greater than 0
        # The chance of this merchant spawning relative to other merchants in this world
        # Examples:
        # i) Two merchants with rarity 1 and 1 have an equal chance spawn (50/50).
        # ii) Two merchants with rarity 1 and 9 spawn with chances 10% and 90% respectively.
        rarity: 1

        # Determines the behaviour of this merchant
        # true: everything will work as expected
        # false: all NPCs of this merchant within this world will be despawn
        # and the item of this merchant will no longer be craftable in this world
        enabled: true

        # Removing the entry of a merchant will cause all NPCs of that
        # merchant to be permanently deleted from that world

      bruna:
        rarity: 1
        enabled: true
      mara:
        rarity: 1
        enabled: true
      dorian:
        rarity: 1
        enabled: true
      marcus:
        rarity: 1
        enabled: true
      edmund:
        rarity: 1
        enabled: true
      gordan:
        rarity: 1
        enabled: true
      seraphim:
        rarity: 1
        enabled: true
      edward:
        rarity: 1
        enabled: true
      rowena:
        rarity: 1
        enabled: true
      leo:
        rarity: 1
        enabled: true
      garrick:
        rarity: 1
        enabled: true
      luna:
        rarity: 1
        enabled: true
      ash:
        rarity: 1
        enabled: true
      nox:
        rarity: 1
        enabled: true
      lyra:
        rarity: 1
        enabled: true
      flora:
        rarity: 1
        enabled: true
      jasper:
        rarity: 1
        enabled: true
      rufus:
        rarity: 1
        enabled: true

# A list of all the merchants in the plugin
# If you want to remove all merchants
# Just set merchants to be null
merchants:

  # An ID (string) that is used by the plugin to identify this merchant
  # Warning: The ID must unique between all merchants and must not contain any spaces

  # READ THIS CAREFULLY

  # Warning: This value cannot be changed. Changing this value will cause
  # unexpected behaviour for merchant NPCs with this ID
  sylphie:

    # The name of the merchant
    name: Sylphie

    # The name of the shop of EconomyShopGUI that the merchant would open
    # READ THIS CAREFULLY
    # Note: A page that leads to shop and shop itself is not the same
    # For example, using the default configuration of EconomyShopGUI as reference,
    # the "Tools and Combat" page that leads to shops but the "Tools" page or "Weapons" page is a shop itself
    # For example if the shop can be opened using "/shop enchanting <player name>" through the console (not in-game)
    # then the value of this field will be "enchanting"
    # Warning: The value of this field must be the exact same as the one used in the "/shop <shop> <player name>" command in the console (not in-game)
    # Note: Before filling this field, try using "/shop <the shop name> <your in-game name>" through the console to check if it opens a shop or not
    # If you want to see all the shops available in your server then you can do so by visualising the permissions of shops through LuckPerms
    # Open a LuckPerms web editor using "/lp editor"
    # Then in the permissions field type "economyshopgui.shop."
    # And the web editor should bring up all the permissions of the available shops
    # If it brings up "economyshopgui.shop.enchanting" then your shop name should be "enchanting"
    # Note: "economyshopgui.shop.all" does not mean there is a shop named "all", it is just a permission that allows players to use all the shops
    shop: enchanting

    # If you have found a skin and want to apply it to a merchant
    # Download that skin and generate the value and signature on mineskin.org and paste them here
    # If you don't want a custom skin just set the values of skin_value and skin_signature to null
    # Warning: Make sure to use quotes around skin_value and skin_signature as they contain
    # Special characters that would break the YAML parser without them
    skin_value: ""
    skin_signature: ""

    # The message the merchant says to a player when interacted with
    # Supports MiniMessage formatting
    default_dialogue: "Sylphie: I am Sylphie, keeper of enchanted knowledge. Return my grimoire to me, and I shall weave enchantments for those who are worthy enough to wield them"

    # The message the merchant says when the player returns the correct item
    # Supports MiniMessage formatting
    correct_item_dialogue: "Sylphie: My grimoire returns to me. You have done well; its enchanted knowledge shall serve us both."

    # The message the merchant says when the player brings the incorrect item
    # Supports MiniMessage formatting
    incorrect_item_dialogue: "Sylphie: No, this is not what I requested. Bring me the correct item, please."

    # The message the merchants says to the player when its already in another interaction
    # The message the merchant says to the player when it starts following the player
    follow_dialogue: "Sylphie: Very well, seeker. Lead on; the world is full of secrets waiting to be uncovered."

    # The message the non-shopkeeper varaint of the merchant says to a player when it stops following the player
    non_shopkeeper_unfollow_dialogue: "Sylphie: Our paths part here. I must return to my studies and hidden workings."

    # The message the shopkeeper varaint of the merchant says to a player when it stops following the player
    shopkeeper_unfollow_dialogue: "Sylphie: I shall remain here. Return when you seek enchanted knowledge."

    # The message sent to a player when this merchant spawns near them
    # Supports MiniMessage formatting
    # If you don't want such message just set spawn_text to null
    spawn_text: <gray><italic>Hm... I spot a strange glow flickering nearby</italic></gray>

    # Whether the merchant should unitially glow when it spawns
    glow: true

    # The radius (in blocks) around a random player within which the merchant can spawn
    spawn_radius: 100

    # Time (in seconds) before the merchant despawns if it has not been turned into a shopkeeper
    # By default, the merchant despawns after 10 minutes
    despawn_time: 600

    # The item that must be given to a merchant to turn it into a shopkeeper
    item:

      # An ID (string) that is used by the plugin to identify this item
      # Warning: Changing this ID will cause all items with the previous ID to not be accepted by the merchant
      # Warning: You must use a unique ID for all id fields
      id: sylphies_grimoire

      # The name of the item
      # Supports MiniMessage formatting
      name: Sylphie's Grimoire

      # Add custom lore to the item
      # Supports multi-line lore with MiniMessage formatting
      # If you don't want to add lore, just set lore to be null
      lore:
        - Hand this to Sylphie

      # Add a custom model data to the item to apply a custom texture over it
      # Warning: Make sure to use unique model data for each item
      # otherwise the same texture may get applied to multiple items
      # If you don't want to add a custom texture just set custom_model_data to be null
      custom_model_data: sylphies_grimoire

      # The crafting recipe of the item
      recipe:

        # The actual shape of the recipe
        shape:
          - GBG
          - BGB
          - GBG

        # The items used in the recipe
        # Must be a valid material name
        # Full list of materials: https://jd.papermc.io/paper/1.21.9/org/bukkit/Material.html
        ingredients:
          G: GLOWSTONE_DUST
          B: BOOK

    # The item in the merchant's GUI which upon clicking leads to the actual shop
    shop_icon:

      # The material of the item
      # Must be a valid material name
      material: ENCHANTED_BOOK

      # The name of the item
      # Supports MiniMessage formatting
      name: Enchanted books

      # Lore of the item
      lore:
        - Buy enchanted books

    # The item in the merchant's GUI which upon clicking leads to the SellGUI
    sellgui_icon:

      # The material of the item
      # Must be a valid material name
      material: ENCHANTED_BOOK

      # The name of the item
      # Supports MiniMessage formatting
      name: Sell items

      # Lore of the item
      lore:
        - Sell enchanting related items in one go

  # IMPORTANT NOTES
  # Cosmetic changes to an merchant item (name, lore, etc.) only apply to newly crafted versions of that merchant item
  # The old items of that merchant item will keep their old appearance, but it will still be accepted by the merchant
  # As long as they have the same ID
  # Cosmetic changes to a merchant (name, dialogue, skin, etc.) apply to all existing NPCs of that merchant not just new NPCs of that merchant

  bruna:
    name: Bruna
    shop: stone
    skin_value: ""
    skin_signature: ""
    default_dialogue: "Bruna: I am Bruna. I work stone into something usable. Bring back my stonecutter, and I will supply you with everything carved from the earth"
    correct_item_dialogue: "Bruna: Excellent work. This stonecutter will turn rough stone into fine craft. You have my thanks."
    incorrect_item_dialogue: "Bruna: That won't do. Please bring me the item I asked for."
    follow_dialogue: "Bruna: All right, I will come along. Just point me toward the work."
    non_shopkeeper_unfollow_dialogue: "Bruna: That's far enough for now. I'll carry on from here."
    shopkeeper_unfollow_dialogue: "Bruna: Right, I'll wait here. Come by when you need stone or something carved."
    spawn_text: <gray><italic>Hm... I hear chisels tapping against stone nearby</italic></gray>
    glow: true
    spawn_radius: 100
    despawn_time: 600
    item:
      id: brunas_stonecutter
      name: Bruna's Stonecutter
      lore:
        - Hand this to Bruna
      custom_model_data: brunas_stonecutter
      recipe:
        shape:
          - SCS
          - DTD
          - SCS
        ingredients:
          S: STONE
          C: COBBLESTONE
          D: DEEPSLATE
          T: STONECUTTER
    shop_icon:
      material: STONE
      name: Buy stone
      lore:
        - Buy stone related items
    sellgui_icon:
      material: STONECUTTER
      name: Sell items
      lore:
        - Sell stone items in one go
  mara:
    name: Mara
    shop: natural
    skin_value: ""
    skin_signature: ""
    default_dialogue: "Mara: You can't collect what you can't dig. Someone walked off with my trowel and now I'm useless. Craft me a new one and I'll sell you everything I've gathered dirt, sand, ice, netherrack, all of it"
    correct_item_dialogue: "Mara: That's the tool! Now I can get back to digging up the world's hidden treasures."
    incorrect_item_dialogue: "Mara: Hmm, no. That is not what I need. Could you try again?"
    follow_dialogue: "Mara: Let us get moving! There is a whole world waiting to be dug up."
    non_shopkeeper_unfollow_dialogue: "Mara: I'll take it from here. There's plenty more ground to cover."
    shopkeeper_unfollow_dialogue: "Mara: I'll set up here, then. Come back when you need natural blocks or supplies."
    spawn_text: <gray><italic>Hm... I can hear someone digging nearby</italic></gray>
    glow: true
    spawn_radius: 100
    despawn_time: 600
    item:
      id: maras_trowel
      name: Mara's Trowel
      lore:
        - Hand this to Mara
      custom_model_data: maras_trowel
      recipe:
        shape:
          - DSD
          - MXM
          - DSD
        ingredients:
          D: DIRT
          S: SAND
          M: MUD
          X: IRON_SHOVEL
    shop_icon:
      material: DIRT
      name: Buy natural blocks
      lore:
        - Buy natural blocks from all biomes
    sellgui_icon:
      material: SAND
      name: Sell items
      lore:
        - Sell natural blocks in one go
  dorian:
    name: Dorian
    shop: decorative_blocks
    skin_value: ""
    skin_signature: ""
    default_dialogue: "Dorian: A craftsman without his palette is nothing. Mine was taken from me or lost, I'd rather not say. Bring it back, and I shall ensure your structures are worthy of being called art"
    correct_item_dialogue: "Dorian: Ah, my palette! Now we can bring a little beauty and colour into this world."
    incorrect_item_dialogue: "Dorian: No, my friend, that is not what I requested. Bring me the proper item."
    follow_dialogue: "Dorian: Lead the way, my friend. Perhaps the journey will offer some inspiration."
    non_shopkeeper_unfollow_dialogue: "Dorian: Then we shall part here. There are more sights to see and inspiration to find."
    shopkeeper_unfollow_dialogue: "Dorian: Very well, I shall remain here. Return when your eye for beauty needs satisfying."
    spawn_text: <gray><italic>Hm... Someone nearby seems to be working with colourful blocks</italic></gray>
    glow: true
    spawn_radius: 100
    despawn_time: 600
    item:
      id: dorians_palette
      name: Dorian's Palette
      lore:
        - Hand this to Dorian
      custom_model_data: dorians_palette
      recipe:
        shape:
          - GTG
          - DXD
          - GTG
        ingredients:
          G: GLASS
          T: TERRACOTTA
          D: WHITE_DYE
          X: CLAY_BALL
    shop_icon:
      material: GLASS
      name: Buy decorative blocks
      lore:
        - Buy coloured glass, concrete, terracotta and more
    sellgui_icon:
      material: TERRACOTTA
      name: Sell items
      lore:
        - Sell decorative blocks in one go
  marcus:
    name: Marcus
    shop: resources
    skin_value: ""
    skin_signature: ""
    default_dialogue: "Marcus: No Charm, no trade. Bring it back, and you will have access to my valuables"
    correct_item_dialogue: "Marcus: The charm! A fine eye for valuable things. Now, let us discuss business."
    incorrect_item_dialogue: "Marcus: No deal. That isn't what I asked for. Come back with the right item."
    follow_dialogue: "Marcus: Very well. Lead on; let us see whether this trip proves worthwhile."
    non_shopkeeper_unfollow_dialogue: "Marcus: Our arrangement ends here. I have other prospects to pursue."
    shopkeeper_unfollow_dialogue: "Marcus: I shall remain here. Return when you're ready to do business."
    spawn_text: <gray><italic>Hm... Someone nearby seems to be trading in valuable resources</italic></gray>
    glow: true
    spawn_radius: 100
    despawn_time: 600
    item:
      id: marcuss_charm
      name: Marcus's Charm
      lore:
        - Hand this to Marcus
      custom_model_data: marcuss_charm
      recipe:
        shape:
          - GDG
          - DAD
          - GDG
        ingredients:
          G: GOLD_INGOT
          D: DIAMOND
          A: AMETHYST_SHARD
    shop_icon:
      material: DIAMOND
      name: Buy resources
      lore:
        - Buy valuable resources
    sellgui_icon:
      material: GOLD_INGOT
      name: Sell items
      lore:
        - Sell resource in one go
  edmund:
    name: Edmund
    shop: crops
    skin_value: ""
    skin_signature: ""
    default_dialogue: "Edmund: My seed pouch went missing and I won't plant a thing without it. It'll turn up somewhere or maybe you can piece one together. Either way, bring it back and you'll have all the crops you need"
    correct_item_dialogue: "Edmund: There it is! With my seed pouch back, the fields will be flourishing in no time."
    incorrect_item_dialogue: "Edmund: I'm afraid that isn't the item I need. Please bring the correct one."
    follow_dialogue: "Edmund: Let us get going, then. There is always more to grow and gather."
    non_shopkeeper_unfollow_dialogue: "Edmund: I'll head back to my own work now. The fields won't tend themselves."
    shopkeeper_unfollow_dialogue: "Edmund: I'll stay here for now. Come by when you need crops or farming supplies."
    spawn_text: <gray><italic>Hm... I can smell freshly harvested crops nearby</italic></gray>
    glow: true
    spawn_radius: 100
    despawn_time: 600
    item:
      id: edmunds_seed_pouch
      name: Edmund's Seed Pouch
      lore:
        - Hand this to Edmund
      custom_model_data: edmunds_seed_pouch
      recipe:
        shape:
          - WPW
          - PBP
          - WPW
        ingredients:
          W: WHEAT_SEEDS
          P: PUMPKIN_SEEDS
          B: BUNDLE
    shop_icon:
      material: WHEAT
      name: Buy crops
      lore:
        - Buy seeds, crops and farming supplies
    sellgui_icon:
      material: CARROT
      name: Sell items
      lore:
        - Sell crops in one go
  gordan:
    name: Gordan
    shop: food
    skin_value: ""
    skin_signature: ""
    default_dialogue: "Gordan: No butcher knife, no cuts. Mine disappeared off my block one morning, gone without a trace. Find it or put one together, and I'll keep you fed better than anyone else in this place"
    correct_item_dialogue: "Gordan: That's my knife! Now we're cooking. I'll make sure you never go hungry."
    incorrect_item_dialogue: "Gordan: Not quite, friend. Bring me what I asked for, and we will be in business."
    follow_dialogue: "Gordan: All right, friend! Lead on, and let us hope there is something good to eat along the way."
    non_shopkeeper_unfollow_dialogue: "Gordan: All right, I'll stop here. I've got a kitchen to get back to."
    shopkeeper_unfollow_dialogue: "Gordan: I'll stay here and keep the food coming. Come back hungry, friend!"
    spawn_text: <gray><italic>Hm... Something delicious seems to be cooking nearby</italic></gray>
