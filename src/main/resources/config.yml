    incorrect_item_dialogue: "Seraphim: This is not what I requested. Return with the proper item."
    follow_dialogue: "Seraphim: Lead on. A good craftsperson knows that fine work can be found anywhere."
    non_shopkeeper_unfollow_dialogue: "Seraphim: This is where I leave you. I've tools to mend and work to return to."
    shopkeeper_unfollow_dialogue: "Seraphim: I'll stay here. Come back when you need a dependable tool."
    spawn_text: <gray><italic>Hm... I hear metal clanging from a workshop nearby</italic></gray>
    glow: true
    spawn_radius: 100
    despawn_time: 600
    item:
      id: seraphims_anvil
      name: Seraphim's Anvil
      lore:
        - Hand this to Seraphim
      custom_model_data: seraphims_anvil
      recipe:
        shape:
          - BIB
          - IAI
          - BIB
        ingredients:
          B: IRON_BLOCK
          I: IRON_INGOT
          A: ANVIL
    shop_icon:
      material: IRON_PICKAXE
      name: Buy tools
      lore:
        - Buy tools and equipment
    sellgui_icon:
      material: IRON_INGOT
      name: Sell items
      lore:
        - Sell tools in one go
  edward:
    name: Edward
    shop: weapons
    skin_value: ""
    skin_signature: ""
    default_dialogue: "Edward: Every weapon I have ever forged was made on that table. It went missing and I have not been able to finish a single blade since. Bring me a new one and I will have the finest weapons ready for you"
    correct_item_dialogue: "Edward: The smithing table! At last, I can return to forging weapons worthy of legends."
    incorrect_item_dialogue: "Edward: That is not the item I need. Please bring the one I requested."
    follow_dialogue: "Edward: Show me the way. A smith never knows where the next great weapon begins."
    non_shopkeeper_unfollow_dialogue: "Edward: The road ends here for now. I've blades waiting to be forged."
    shopkeeper_unfollow_dialogue: "Edward: I'll remain here. Return when you're ready to arm yourself."
    spawn_text: <gray><italic>Hm... I hear a hammer ringing against metal nearby</italic></gray>
    glow: true
    spawn_radius: 100
    despawn_time: 600
    item:
      id: edwards_smithing_table
      name: Edward's Smithing Table
      lore:
        - Hand this to Edward
      custom_model_data: edwards_smithing_table
      recipe:
        shape:
          - IBI
