name: WanderingMerchants
version: 1.1.4
main: com.mahin.Plugin
api-version: 26.1.2
description: An RPG plugin that spawns NPC merchants around players
author: MahinBro001238
website: https://github.com/MahinBro001238
depend:
  - Citizens
  - EconomyShopGUI
# ---------------------------------------------
# LEGACY CODE
# ---------------------------------------------
permissions:
  wanderingmerchants.migrate_item:
    description: Allows converting legacy merchant items
    default: true
commands:
  migrate_item:
    description: Converts an old merchant item in your hand to the new format
    usage: /migrate_item
    permission: wanderingmerchants.migrate_item
# ---------------------------------------------
